services:
  app:
    build: .
    ports:
      - "${DJANGO_PORT:-8000}:${DJANGO_PORT:-8000}"
    volumes:
      - .:/app
      - python-venv:/app/.venv
    environment:
      SECRET_KEY: ${SECRET_KEY:-django-insecure-container-development-only}
      DEBUG: ${DEBUG:-False}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
      DJANGO_PORT: ${DJANGO_PORT:-8000}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-http://localhost}
      MEDIA_STORAGE_BACKEND: ${MEDIA_STORAGE_BACKEND:-django.core.files.storage.FileSystemStorage}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-}
      AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-}
      AWS_S3_ADDRESSING_STYLE: ${AWS_S3_ADDRESSING_STYLE:-}
      AWS_QUERYSTRING_AUTH: ${AWS_QUERYSTRING_AUTH:-false}
      AWS_S3_CUSTOM_DOMAIN: ${AWS_S3_CUSTOM_DOMAIN:-}
volumes:
  python-venv:
